# .github/workflows/MBAutoFarm.yml
name: MBAutoFarm

on:
  # push:
  #   paths:
  #     - "source/**"
  #     - "requirements.txt"
  #     - ".github/workflows/MBAutoFarm.yml"
  pull_request:
    paths:
      - "source/**"
      - "requirements.txt"
      - ".github/workflows/MBAutoFarm.yml"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 缓存 Nuitka 编译结果
        uses: actions/cache@v4
        with:
          path: ~/AppData/Local/Nuitka
          key: nuitka-${{ runner.os }}-py3.14-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            nuitka-${{ runner.os }}-py3.14-

      - name: Nuitka 打包
        working-directory: source
        run: python build.py

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: MBAutoFarm-windows
          path: source/dist/MBAutoFarm.dist/
          if-no-files-found: error
